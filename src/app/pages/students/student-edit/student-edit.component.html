<h2>Modifier l'étudiant</h2>
<form
  (ngSubmit)="updateStudent()"
  #studentForm="ngForm"
>
  <div>
    <label>
      Prénom
    </label>
    <input
      type="text"
      name="firstName"
      [(ngModel)]="student.firstName"
      required
    >
  </div>
  <br>
  <div>
    <label>
      Nom
    </label>
    <input
      type="text"
      name="lastName"
      [(ngModel)]="student.lastName"
      required
    >
  </div>
  <br>
  <div>
    <label>
      Email
    </label>
    <input
      type="email"
      name="email"
      [(ngModel)]="student.email"
      required
    >
  </div>
  <br>
  <button
    type="submit"
    [disabled]="studentForm.invalid"
  >
    Modifier
  </button>
</form>
@if (errorMessage) {
  <p>
    {{ errorMessage }}
  </p>
}
