<div class="login-page">
    <div class="login-card">
        <h2>Connexion</h2>
    <p class="subtitle">Connectez-vous à votre compte</p>

        <form (ngSubmit)="login()" #loginForm="ngForm">
            <div class="form-group">
                <label for="login">Login</label>
                <input type="text" name="login" id="login" [(ngModel)]="loginRequest.login" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" name="password" id="password" [(ngModel)]="loginRequest.password" required>
            </div>

            <button type="submit">
                Login
            </button>
        </form>
    </div>
</div>
